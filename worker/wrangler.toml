name = "blog-likes"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://buildwithvibs.in,http://localhost:3000"

# Create the namespace with `npx wrangler kv namespace create LIKES`
# and paste the id it prints here.
[[kv_namespaces]]
binding = "LIKES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# IP_SALT is a secret: set it with `npx wrangler secret put IP_SALT`.
