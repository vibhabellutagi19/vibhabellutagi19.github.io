name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Picks up newly published study posts even when this repo hasn't changed.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# A scheduled run and a push can land together; let them take turns.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Version comes from the packageManager field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Study posts live in system-design-public. They are copied in for the build
      # only and never committed here.
      - name: Check out study repo
        uses: actions/checkout@v4
        with:
          repository: vibhabellutagi19/system-design-public
          path: .study

      - name: Sync published study posts
        run: node scripts/sync-study-posts.mjs .study

      - name: Build static site
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
