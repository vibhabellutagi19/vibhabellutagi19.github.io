<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post - Vibhavari Bellutagi</title>
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Modern Fonts: Playfair Display (Serif) & Inter (Sans) & IBM Plex Mono -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../lightbox.js"></script>
  </head>
  <body>
    <!-- Reading Progress Bar -->
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <nav>
      <button class="mobile-menu-btn" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a href="/" class="logo">VB</a>
      <ul class="nav-links">
        <li><a href="/#experience">Experience</a></li>
        <li><a href="index.html">Blog</a></li>
        <li><a href="/#photography">Photography</a></li>
      </ul>
    </nav>

    <!-- Main Grid Layout -->
    <main class="post-grid">
      <!-- Left Sidebar (Navigation/Meta) -->
      <aside class="sidebar-left">
        <a href="index.html" class="back-link">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back
        </a>
      </aside>

      <!-- Center Content -->
      <article>
        <header class="post-header">
          <div id="article-meta" class="article-meta"></div>
          <h1 id="article-title" class="article-title"></h1>
          <div id="author-details" class="author-details-section"></div>
          <p id="article-excerpt" class="article-excerpt"></p>
        </header>

        <div id="article-content" class="article-content">
          <div class="loading">Loading post...</div>
        </div>

        <div class="like-section">
          <h3>Enjoyed this article?</h3>
          <p class="like-subtitle">
            Thank you for reading! Feel free to share this post if you found it
            useful.
          </p>
          <div id="share-links" class="share-links"></div>
        </div>
        <!-- Next/Prev Navigation -->
        <nav id="post-navigation" class="post-navigation"></nav>
      </article>

      <!-- Right Sidebar (TOC) -->
      <aside class="sidebar-right">
        <div id="post-toc">
          <!-- Dynamic TOC will be injected here -->
        </div>
      </aside>
    </main>

    <script src="utils.js"></script>
    <script type="module" src="post.js"></script>
    <script>
      // Simple script for reading progress bar
      window.addEventListener('scroll', () => {
        const scrollTop =
          document.documentElement.scrollTop || document.body.scrollTop;
        const scrollHeight =
          document.documentElement.scrollHeight || document.body.scrollHeight;
        const clientHeight =
          document.documentElement.clientHeight || document.body.clientHeight;
        const scrolled = (scrollTop / (scrollHeight - clientHeight)) * 100;
        document.getElementById('progress-bar').style.width = scrolled + '%';
      });

      // Mobile Menu Toggle
      const mobileBtn = document.querySelector('.mobile-menu-btn');
      const navLinks = document.querySelector('.nav-links');

      if (mobileBtn && navLinks) {
        mobileBtn.addEventListener('click', () => {
          mobileBtn.classList.toggle('open');
          navLinks.classList.toggle('open');
        });
      }
    </script>
  </body>
</html>
